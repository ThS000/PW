<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>

    <script src="script.js" defer></script>
</head>
<body>

    <h1>Calculadora</h1>

    <input
        type="number"
        id="numero1-input"
        placeholder="Primeiro número"
    >

    <input
        type="number"
        id="numero2-input"
        placeholder="Segundo número"
    >

    <div>

        <button id="somar-btn">
            Somar
        </button>

        <button id="subtrair-btn">
            Subtrair
        </button>

        <button id="multiplicar-btn">
            Multiplicar
        </button>

        <button id="dividir-btn">
            Dividir
        </button>

    </div>

    <p id="resultado">
        Resultado:
    </p>

</body>
</html>
